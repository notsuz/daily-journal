name: Daily Journal Entry

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create today's journal entry
        run: |
          mkdir -p journal
          TODAY=$(date -u '+%Y-%m-%d')
          FILENAME="journal/${TODAY}.md"
          
          if [ ! -f "$FILENAME" ]; then
            echo "# 📅 Journal Entry - $TODAY" > "$FILENAME"
            echo "" >> "$FILENAME"
            echo "## 🧠 What did I learn today?" >> "$FILENAME"
            echo "" >> "$FILENAME"
            echo "## 🚀 What did I accomplish?" >> "$FILENAME"
            echo "" >> "$FILENAME"
            echo "## 📝 Random Thoughts & Ideas" >> "$FILENAME"
            echo "" >> "$FILENAME"
            echo "## 🎯 What am I focusing on tomorrow?" >> "$FILENAME"
            echo "" >> "$FILENAME"
            echo "---" >> "$FILENAME"
            echo "*Entry automatically created. Update this file anytime!*" >> "$FILENAME"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journal/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📝 Daily journal entry"
            git push
          fi
